  <style>
:root {
  --bg: #04060d;
  --panel: rgba(12, 17, 32, 0.86);
  --border: rgba(140, 170, 230, 0.18);

* { box-sizing: border-box; }

html, body {

.meta { color: var(--muted); font-size: 12px; font-weight: 400; }
.clock { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock b { display: block; font-size: 16px; }

.icon-btn {

}

button, select, input[type="search"], input[type="number"], input[type="datetime-local"] {
  font: inherit;
  color: var(--text);

  padding: 6px 10px;

}
button { cursor: pointer; }
button:hover { background: rgba(255, 255, 255, 0.12); }
button.primary { background: rgba(127, 176, 255, 0.22); border-color: rgba(127, 176, 255, 0.5); font-weight: 600; }
input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 1px; }
select option { background: #0c1120; }

#panel {
  position: fixed;
  top: 64px; right: 12px; bottom: 12px;
  width: 340px;
  overflow-y: auto;
  padding: 4px 16px 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  backdrop-filter: blur(10px);
  transition: transform 0.25s ease, opacity 0.25s ease;
}
#panel.closed { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
#panel section { padding: 12px 0; border-bottom: 1px solid var(--border); }
#panel section:last-of-type { border-bottom: 0; }
#panel h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: 0.04em; color: var(--accent); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid2 label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
.grid2 input { width: 100%; }
.span2 { grid-column: span 2; }
.row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.row input[type="search"] { flex: 1; min-width: 0; }
.row select { flex: 1; min-width: 0; }
.block { display: block; color: var(--muted); font-size: 12px; margin-top: 8px; }
.block input { display: block; width: 100%; margin-top: 4px; }

}

.leaflet-container { font: inherit; }

  border: 1px solid var(--border);
  border-radius: 12px;
  backdrop-filter: blur(10px);
}
#info h3 { margin: 0 0 4px; font-size: 16px; }
#info dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 6px 0 0; font-size: 12px; }
#info dt { color: var(--muted); }
#info dd { margin: 0; font-variant-numeric: tabular-nums; }

#status {
  position: fixed;
  left: 50%; top: 70px;
  transform: translateX(-50%);
  padding: 6px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 12px;
  color: var(--muted);
}

#hint {
  position: fixed;
  left: 16px; bottom: 14px;
  color: var(--muted);
  font-size: 12px;
  pointer-events: none;
  text-shadow: 0 1px 3px #000;
}

@media (max-width: 640px) {
  #topbar { padding-left: 16px; padding-right: 16px; gap: 10px; }
  #placeName { font-size: 15px; }
  .clock { font-size: 12px; }
  .clock b { font-size: 14px; }
  #panel {
    top: auto; left: 0; right: 0; bottom: 0;
    width: auto;
    max-height: 62vh;
    border-radius: 16px 16px 0 0;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }
  #panel.closed { transform: translateY(calc(100% + 24px)); }
  #map { height: 180px; }
  #hint { display: none; }
  #info { bottom: 16px; }
}

</style>
</head>
<body>
  <div id="sky"></div>

  <header id="topbar">
    <div class="place">
      <div id="placeName">서울</div>
      <div id="placeMeta" class="meta"></div>
    </div>
    <div id="clock" class="clock"></div>
    <button id="togglePanel" class="icon-btn" title="설정 열기/닫기" aria-label="설정 열기/닫기">☰</button>
  </header>

  <aside id="panel">
    <section>
      <h2>위치</h2>
      <form id="locForm" class="grid2">
        <label>위도 <input id="lat" type="number" step="0.0001" min="-90" max="90" required></label>
        <label>경도 <input id="lon" type="number" step="0.0001" min="-180" max="180" required></label>
        <button type="submit" class="primary span2">이 위치의 하늘 보기</button>
      </form>
      <div class="row">
        <button id="geoBtn" type="button">📍 내 위치</button>
        <select id="presets" aria-label="추천 장소">
          <option value="">추천 장소…</option>
        </select>
      </div>
      <form id="searchForm" class="row">
        <input id="searchQ" type="search" placeholder="장소 이름 검색 (예: 지리산)">
        <button type="submit">검색</button>
      </form>
      <ul id="searchResults"></ul>
    </section>

    <section>
      <h2>시간</h2>
      <label class="block">현지 시각 <span id="tzLabel" class="meta"></span>
        <input id="datetime" type="datetime-local" step="60">
      </label>
      <input id="timeSlider" type="range" min="0" max="1439" step="1" aria-label="하루 중 시각">
      <div class="row">
        <button id="nowBtn" type="button">지금</button>
        <button id="tonightBtn" type="button">오늘 밤 21시</button>
        <button id="playBtn" type="button">▶ 재생</button>
        <select id="speed" aria-label="재생 속도">
          <option value="60">1분/초</option>
          <option value="600" selected>10분/초</option>
          <option value="3600">1시간/초</option>
        </select>
      </div>
    </section>

    <section>
      <h2>보기</h2>
      <div class="checks">
        <label><input type="checkbox" data-opt="lines" checked> 별자리 선</label>
        <label><input type="checkbox" data-opt="conNames" checked> 별자리 이름</label>
        <label><input type="checkbox" data-opt="starNames" checked> 별 이름</label>
        <label><input type="checkbox" data-opt="planets" checked> 행성·달</label>
        <label><input type="checkbox" data-opt="milkyWay" checked> 은하수</label>
        <label><input type="checkbox" data-opt="grid"> 고도/방위 격자</label>
        <label><input type="checkbox" data-opt="terrain" checked> 실제 지형</label>
        <label><input type="checkbox" data-opt="buildings" checked> 건물</label>
        <label><input type="checkbox" data-opt="atmosphere" checked> 대기·밝기 효과</label>
        <label><input type="checkbox" id="useCloud"> 현재 구름양 반영</label>
      </div>
      <label class="block">관측 높이 <span class="meta">(지면 위, m · 옥상이나 전망대에서 볼 때)</span>
        <input id="eyeHeight" type="number" min="0" max="2000" step="1" value="0">
      </label>
      <label class="block">빛공해 <span id="pollutionLabel" class="meta"></span>
        <input id="pollution" type="range" min="0" max="1" step="0.05" value="0.25">
      </label>
      <div class="row">
        <button type="button" data-look="0">북</button>
        <button type="button" data-look="90">동</button>
        <button type="button" data-look="180">남</button>
        <button type="button" data-look="270">서</button>
        <button type="button" id="zenithBtn">전천</button>
      </div>
    </section>

    <section>
      <h2>지도 <span class="meta">(클릭해서 위치 선택)</span></h2>
      <div id="map"></div>
      <div class="row">
        <label><input type="radio" name="basemap" value="sat" checked> 위성</label>
        <label><input type="radio" name="basemap" value="osm"> 일반 지도</label>
      </div>
    </section>

    <p class="credits">
      별 자료: Hipparcos·Yale BSC (d3-celestial, BSD-3) · 지형·시간대: Open-Meteo · 건물: OpenStreetMap (Overpass) · 지명: OpenStreetMap Nominatim ·
      위성 사진: Esri World Imagery
    </p>
  </aside>

  <div id="info" hidden></div>
  <div id="status" hidden></div>
  <div id="hint">드래그: 둘러보기 · 휠/핀치: 확대 · 별 클릭: 정보</div>

// 고도 자료: Open-Meteo Elevation API (Copernicus DEM 90 m). 실패하면 위치 기반 가상 지형을 쓴다.
(function (root) {
  'use strict';

  const N_AZ = 180; // 2° 간격
  const DIST_KM = [0.25, 0.5, 0.8, 1.2, 1.8, 2.6, 3.6, 5, 7, 9.5, 13, 17, 22, 29, 38, 50];
  const NEAR_KM = 1.5;
  const MID_KM = 8;
  const EARTH_R = 6371;
  const REFRACTION_K = 0.13;
  const EYE_HEIGHT_M = 1.7;
  const cache = new Map();

  function destination(lat, lon, azDeg, distKm) {
    const d = distKm / EARTH_R;
    const t = (azDeg * Math.PI) / 180;
    const p1 = (lat * Math.PI) / 180;
    const l1 = (lon * Math.PI) / 180;
    const p2 = Math.asin(Math.sin(p1) * Math.cos(d) + Math.cos(p1) * Math.sin(d) * Math.cos(t));
    const l2 = l1 + Math.atan2(Math.sin(t) * Math.sin(d) * Math.cos(p1), Math.cos(d) - Math.sin(p1) * Math.sin(p2));
    return [(p2 * 180) / Math.PI, ((((l2 * 180) / Math.PI + 540) % 360) - 180)];
  }

  async function fetchElevations(points, onProgress) {
    const out = new Array(points.length);
    const chunks = [];
    for (let i = 0; i < points.length; i += 100) chunks.push(i);
    let done = 0;
    const worker = async () => {
      while (chunks.length) {
        const start = chunks.shift();
        const part = points.slice(start, start + 100);
        const url = 'https://api.open-meteo.com/v1/elevation?latitude=' +
          part.map((p) => p[0].toFixed(5)).join(',') + '&longitude=' + part.map((p) => p[1].toFixed(5)).join(',');
        const res = await fetch(url);
        if (!res.ok) throw new Error('elevation HTTP ' + res.status);
        const json = await res.json();
        json.elevation.forEach((e, k) => { out[start + k] = e; });
        done++;
        if (onProgress) onProgress(done / Math.ceil(points.length / 100));
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    return out;
  }

  function elevationAngle(h0, h, distKm) {
    const drop = ((distKm * distKm) / (2 * EARTH_R)) * (1 - REFRACTION_K) * 1000;
    return (Math.atan2(h - h0 - drop, distKm * 1000) * 180) / Math.PI;
  }

  function emptyProfile() {
    return {
      far: new Float32Array(N_AZ), mid: new Float32Array(N_AZ), near: new Float32Array(N_AZ),
      water: new Float32Array(N_AZ), observerElevation: 0, source: 'flat',
    };
  }

  // extra: 지면보다 높은 곳(옥상, 전망대)에서 볼 때 추가 높이 (m)
  function buildProfile(h0, grid, extra = 0) {
    const prof = emptyProfile();
    prof.observerElevation = h0;
    prof.grid = grid;
    prof.distKm = DIST_KM;
    const eye = h0 + EYE_HEIGHT_M + extra;
    // 가장 낮은 지평선은 수평선의 강하각(dip)
    const dip = -Math.sqrt((2 * Math.max(eye, 1)) / (EARTH_R * 1000 / (1 - REFRACTION_K))) * 180 / Math.PI;
    for (let a = 0; a < N_AZ; a++) {
      let far = dip, mid = -90, near = -90, water = 0, count = 0;
      for (let k = 0; k < DIST_KM.length; k++) {
        const h = grid[a][k];
        if (h == null || Number.isNaN(h)) continue;
        const ang = elevationAngle(eye, h, DIST_KM[k]);
        far = Math.max(far, ang);
        if (DIST_KM[k] <= MID_KM) mid = Math.max(mid, ang);
        if (DIST_KM[k] <= NEAR_KM) near = Math.max(near, ang);
        if (DIST_KM[k] >= 0.5) { count++; if (h <= 0.5) water++; }
      }
      prof.far[a] = far;
      prof.mid[a] = Math.max(mid, dip);
      prof.near[a] = Math.max(near, dip);
      prof.water[a] = count ? water / count : 0;
    }
    return prof;
  }

  // 결정적 의사 난수 잡음으로 만든 가상 산 능선
  function syntheticProfile(lat, lon) {
    let seed = Math.floor((lat + 90) * 1000) * 7919 + Math.floor((lon + 180) * 1000);
    const rand = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    const waves = [];
    for (let i = 0; i < 7; i++) waves.push({ f: 1 + Math.floor(rand() * (3 + i * 4)), p: rand() * Math.PI * 2, a: 1.6 / (i + 1) });
    const prof = emptyProfile();
    prof.source = 'synthetic';
    for (let a = 0; a < N_AZ; a++) {
      const t = (a / N_AZ) * Math.PI * 2;
      let h = 0;
      for (const w of waves) h += w.a * Math.sin(w.f * t + w.p);
      prof.far[a] = Math.max(0.3, 1.8 + h);
      prof.mid[a] = Math.max(0.1, 0.9 + h * 0.6 + 0.6 * Math.sin(5 * t + waves[0].p));
      prof.near[a] = Math.max(-0.2, 0.2 + 0.5 * Math.sin(9 * t + waves[1].p) * Math.sin(3 * t));
    }
    return prof;
  }

  async function loadHorizon(lat, lon, onProgress) {
    const key = lat.toFixed(4) + ',' + lon.toFixed(4);
    if (cache.has(key)) return cache.get(key);
    const points = [[lat, lon]];
    for (let a = 0; a < N_AZ; a++) {
      for (const d of DIST_KM) points.push(destination(lat, lon, (a * 360) / N_AZ, d));
    }
    const elev = await fetchElevations(points, onProgress);
    const grid = [];
    for (let a = 0; a < N_AZ; a++) grid.push(elev.slice(1 + a * DIST_KM.length, 1 + (a + 1) * DIST_KM.length));
    const prof = buildProfile(elev[0] || 0, grid);
    prof.source = 'dem';
    cache.set(key, prof);
    return prof;
  }

  // 관측 높이만 바꿔 같은 고도 자료로 다시 계산
  function reprofile(prof, extra) {
    if (!prof.grid) return prof;
    const p = buildProfile(prof.observerElevation, prof.grid, extra);
    p.source = prof.source;
    return p;
  }

  // 지역 시간대, 구름양 (Open-Meteo Forecast API)
  async function loadLocalInfo(lat, lon) {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat.toFixed(4) + '&longitude=' + lon.toFixed(4) +
      '&timezone=auto&current=cloud_cover,temperature_2m,is_day';
    const res = await fetch(url);
    if (!res.ok) throw new Error('forecast HTTP ' + res.status);
    const j = await res.json();
    return {
      timezone: j.timezone, tzAbbr: j.timezone_abbreviation, utcOffsetMin: Math.round(j.utc_offset_seconds / 60),
      cloudCover: j.current ? j.current.cloud_cover : null, temperature: j.current ? j.current.temperature_2m : null,
    };
  }

  // 지명 (OpenStreetMap Nominatim)
  async function reverseGeocode(lat, lon) {
    const url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&accept-language=ko&lat=' + lat + '&lon=' + lon;
    const res = await fetch(url);
    if (!res.ok) throw new Error('geocode HTTP ' + res.status);
    const j = await res.json();
    if (j.error) return null;
    const a = j.address || {};
    const parts = [a.city || a.town || a.village || a.county || a.state_district, a.state, a.country].filter(Boolean);
    return [...new Set(parts)].join(', ') || j.display_name;
  }

  async function searchPlace(query) {
    const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=ko&q=' + encodeURIComponent(query);
    const res = await fetch(url);
    if (!res.ok) throw new Error('search HTTP ' + res.status);
    return (await res.json()).map((r) => ({ name: r.display_name, lat: +r.lat, lon: +r.lon }));
  }

  root.Terrain = { N_AZ, EYE_HEIGHT_M, loadHorizon, reprofile, syntheticProfile, emptyProfile, loadLocalInfo, reverseGeocode, searchPlace };
})(window);

  <script>
// 주변 건물로 지평선 윤곽을 만든다.
// 건물 자료: OpenStreetMap (Overpass API). 높이 태그가 없으면 층수 × 3.2 m, 그것도 없으면 기본 높이를 쓴다.
(function (root) {
  'use strict';

  const N_BINS = 1440; // 0.25° 간격 (건물 벽은 지형보다 각이 져서 촘촘하게)
  const NEAR_M = 700; // 이 거리 안의 건물은 모두
  const FAR_M = 6000; // 이 거리 안에서는 고층 건물만
  const EARTH_R_M = 6371000;
  const DEFAULT_HEIGHT = { house: 7, detached: 7, garage: 3, shed: 3, apartments: 30, commercial: 15, office: 25, church: 15 };
  const ENDPOINTS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.private.coffee/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
  ];
  const cache = new Map();

  function nearQuery(lat, lon) {
    const a = `(around:${NEAR_M},${lat},${lon})`;
    return `[out:json][timeout:40];(way["building"]${a};way["building:part"]${a};);out tags geom qt;`;
  }

  // 먼 곳은 높이·층수 태그가 있는 건물만 골라 서버 부담을 줄인다
  function farQuery(lat, lon) {
    const a = `(around:${FAR_M},${lat},${lon})`;
    return `[out:json][timeout:60];(
way["building"]["height"]${a}(if:number(t["height"])>=50);
way["building:part"]["height"]${a}(if:number(t["height"])>=50);
way["building"]["building:levels"]${a}(if:number(t["building:levels"])>=16);
);out tags geom qt;`;
  }

  function heightOf(tags) {
    const h = parseFloat(tags.height);
    if (Number.isFinite(h) && h > 0) return h;
    const lv = parseFloat(tags['building:levels']);
    if (Number.isFinite(lv) && lv > 0) return lv * 3.2 + 1;
    return DEFAULT_HEIGHT[tags.building] || 9;
  }

  async function runQuery(q) {
    let lastErr = null;
    for (const url of ENDPOINTS) {
      try {
        const res = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(q),
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        // 시간 초과 등은 HTTP 200에 remark로만 알려 준다
        if (json.remark && /error|timed out|out of memory/i.test(json.remark)) throw new Error(json.remark);
        return json.elements || [];
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('no endpoint');
  }

  async function load(lat, lon) {
    const key = lat.toFixed(4) + ',' + lon.toFixed(4);
    if (cache.has(key)) return cache.get(key);
    const [near, far] = await Promise.allSettled([runQuery(nearQuery(lat, lon)), runQuery(farQuery(lat, lon))]);
    if (near.status === 'rejected' && far.status === 'rejected') throw near.reason;
    const kx = 111320 * Math.cos((lat * Math.PI) / 180), ky = 110540;
    const seen = new Set();
    const list = [];
    for (const r of [near, far]) {
      if (r.status !== 'fulfilled') continue;
      for (const el of r.value) {
        if (seen.has(el.id) || !el.geometry || el.geometry.length < 3) continue;
        seen.add(el.id);
        const pts = el.geometry.map((g) => [(g.lon - lon) * kx, (g.lat - lat) * ky]);
        list.push({ pts, h: heightOf(el.tags || {}) });
      }
    }
    const data = { list, nearOk: near.status === 'fulfilled', farOk: far.status === 'fulfilled' };
    if (data.nearOk && data.farOk) cache.set(key, data);
    return data;
  }

  function containsOrigin(pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if ((yi > 0) !== (yj > 0) && 0 < ((xj - xi) * -yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }

  // 지형 고도 자료로 (방위, 거리) 지점의 땅 높이를 관측 지점 대비로 추정한다.
  // 고도 자료(90 m)는 건물 높이가 일부 섞인 표면 모델이라, 앞뒤 표본 중 낮은 쪽을 쓴다.
  function groundFn(terrain) {
    if (!terrain || !terrain.grid) return () => 0;
    const dist = terrain.distKm;
    const grid = terrain.grid;
    const h0 = terrain.observerElevation;
    const nAz = grid.length;
    return (az, dKm) => {
      const row = grid[Math.round((az / 360) * nAz) % nAz];
      if (dKm <= dist[0]) return 0;
      let k = 0;
      while (k < dist.length - 2 && dist[k + 1] < dKm) k++;
      const a = row[k], b = row[k + 1];
      const g = a == null ? b : b == null ? a : Math.min(a, b);
      return g == null ? 0 : g - h0;
    };
  }

  // eye: 관측자 눈높이 (지면 기준 m). terrain: 지형 윤곽 결과(있으면 건물 밑동 높이에 반영).
  // 결과: 방위 칸마다 건물 꼭대기 고도각(°)과 거리(km)
  function profile(data, eye, terrain) {
    const top = new Float32Array(N_BINS).fill(-90);
    const dist = new Float32Array(N_BINS).fill(10);
    const binDeg = 360 / N_BINS;
    const ground = groundFn(terrain);
    for (const b of data.list) {
      if (containsOrigin(b.pts)) continue; // 관측자가 서 있는 건물은 제외
      const pts = b.pts;
      let cx = 0, cy = 0;
      for (const p of pts) { cx += p[0]; cy += p[1]; }
      cx /= pts.length; cy /= pts.length;
      const cd = Math.hypot(cx, cy);
      const base = ground(((Math.atan2(cx, cy) * 180) / Math.PI + 360) % 360, cd / 1000);
      const rel = base + b.h - eye;
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i], q = pts[(i + 1) % pts.length];
        const az1 = Math.atan2(p[0], p[1]) / (Math.PI / 180);
        const az2 = Math.atan2(q[0], q[1]) / (Math.PI / 180);
        const span = Math.abs(((az2 - az1 + 540) % 360) - 180);
        const n = Math.min(2000, Math.ceil(span / (binDeg * 0.8)) + 1);
        for (let k = 0; k <= n; k++) {
          const t = k / n;
          const x = p[0] + (q[0] - p[0]) * t, y = p[1] + (q[1] - p[1]) * t;
          const d = Math.max(Math.hypot(x, y), 3);
          const drop = (d * d) / (2 * EARTH_R_M) * 0.87; // 지구 곡률 (대기 굴절 보정 포함)
          const ang = (Math.atan2(rel - drop, d) * 180) / Math.PI;
          const az = ((Math.atan2(x, y) * 180) / Math.PI + 360) % 360;
          const bin = Math.floor(az / binDeg) % N_BINS;
          if (ang > top[bin]) { top[bin] = ang; dist[bin] = d / 1000; }
        }
      }
    }
    return { top, dist, count: data.list.length };
  }

  root.Buildings = { N_BINS, load, profile };
})(window);

    vec3 water = mix(mix(vec3(0.03, 0.05, 0.1), vec3(0.008, 0.012, 0.025), depth), mix(vec3(0.42, 0.56, 0.7), vec3(0.08, 0.2, 0.33), depth), day);
    vec2 h2 = normalize(d.xy + 1e-6);
    float sparkle = 0.25 + 0.75 * step(0.55, hash(floor(gl_FragCoord.xy / vec2(7.0, 2.0))));
    vec2 m2 = normalize(uMoon.xy + 1e-6);
    float glitter = pow(max(dot(h2, m2), 0.0), 300.0) * step(0.0, uMoon.z) * moon * sparkle;
    vec2 s2 = normalize(uSun.xy + 1e-6);
    glitter += pow(max(dot(h2, s2), 0.0), 120.0) * smoothstep(-0.02, 0.1, uSun.z) * sparkle * 0.8;
    water += glitter * vec3(0.9, 0.85, 0.7) * (1.0 - depth);
    col = mix(col, water, sea);
  }
  col *= 0.55 + 0.45 * smoothstep(-35.0, 0.0, alt);

  // 건물: 거리가 멀수록 대기에 묻혀 흐려지고, 밤에는 창문 불빛이 켜진다
  if (edgeB > 0.0) {
    float dk = max(bd.g, 0.01);
    float haze = smoothstep(0.2, 6.0, dk);
    vec3 bN = mix(vec3(0.016, 0.018, 0.026), vec3(0.04, 0.05, 0.08), haze) * lightN;
    vec3 bD = mix(vec3(0.34, 0.35, 0.38), vec3(0.56, 0.62, 0.7), haze);
    vec3 bcol = mix(bN, bD, day);
    float dm = dk * 1000.0;
    float cellA = degrees(3.2 / dm);
    float cellW = degrees(3.4 / dm);
    float base = degrees(atan(-uEye, dm));
    vec2 g = vec2(degrees(az) / cellW, (alt - base) / cellA);
    vec2 cell = floor(g);
    vec2 f = fract(g);
    float inWin = step(0.22, f.x) * step(f.x, 0.78) * step(0.3, f.y) * step(f.y, 0.82) * step(0.5, cell.y);
    float on = step(0.62, hash(cell + vec2(floor(dk * 53.0), 7.0)));
    float detail = smoothstep(2.5, 6.0, cellA / uDegPerPx);
    float lit = mix(0.07, inWin * on, detail);
    vec3 winCol = mix(vec3(1.0, 0.76, 0.42), vec3(0.82, 0.9, 1.0), step(0.7, hash(cell * 1.37)));
    bcol += (1.0 - day) * uAtmos * lit * winCol * mix(0.75, 0.35, haze);
    col = mix(col, bcol, edgeB);
  }
  col += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
  outColor = vec4(col * edge, edge);
}`;

  function createGL(canvas, fragSrc) {
    const gl = canvas.getContext('webgl2', { premultipliedAlpha: true, alpha: true, antialias: false });
    if (!gl) return null;
    const compile = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fragSrc));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const uniforms = {};
    const n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(prog, i);
      uniforms[info.name] = gl.getUniformLocation(prog, info.name);
    }
    return { gl, prog, uniforms };
  }

  // ---------- 별 색 (B−V 색지수 → RGB) ----------
  const BV_TABLE = [[-0.4, [155, 176, 255]], [0.0, [202, 215, 255]], [0.4, [248, 247, 255]], [0.6, [255, 244, 234]],
    [1.0, [255, 210, 161]], [1.5, [255, 173, 81]], [2.0, [255, 140, 58]]];
  function bvColor(bv) {
    bv = clamp(bv, -0.4, 2.0);
    for (let i = 1; i < BV_TABLE.length; i++) {
      if (bv <= BV_TABLE[i][0]) {
        const [b0, c0] = BV_TABLE[i - 1], [b1, c1] = BV_TABLE[i];
        const t = (bv - b0) / (b1 - b0);
        return c0.map((c, k) => Math.round(c + (c1[k] - c) * t));
      }
    }
    return BV_TABLE[BV_TABLE.length - 1][1];
  }

  const CARDINALS = [['북', 0], ['북동', 45], ['동', 90], ['남동', 135], ['남', 180], ['남서', 225], ['서', 270], ['북서', 315]];

  class SkyView {
    constructor(container, data) {
      this.container = container;
      this.layers = ['sky', 'stars', 'ground', 'overlay'].map((name) => {
        const c = document.createElement('canvas');
        c.className = 'sky-layer sky-' + name;
        container.appendChild(c);
        return c;
      });
      const [skyC, starC, groundC, overC] = this.layers;
      this.skyGL = createGL(skyC, SKY_FRAG);
      this.groundGL = createGL(groundC, GROUND_FRAG);
      if (!this.skyGL || !this.groundGL) throw new Error('WebGL2를 지원하지 않는 브라우저입니다.');
      this.ctx = starC.getContext('2d');
      this.octx = overC.getContext('2d');

      this.view = { az: 180, alt: 25, fov: 100 };
      this.lat = 37.5665;
      this.lon = 126.978;
      this.time = Date.now();
      this.opts = { lines: true, conNames: true, starNames: true, planets: true, milkyWay: true, grid: false,
        terrain: true, buildings: true, atmosphere: true, pollution: 0.25, cloud: 0 };
      this.profile = window.Terrain.emptyProfile();
      this.flatProfile = window.Terrain.emptyProfile();
      this.picks = [];
      this.moonLight = 0;
      this.prepareData(data);
      this.makeSprites();
      this.horizonTex = null;
      this.buildTex = null;
      this.buildings = null;
      this.buildTop = new Float32Array(1).fill(-90);
      this.eyeHeight = 1.7;
      this.uploadHorizon();
      this.resize();
    }

    prepareData(data) {
      const names = data.starNames;
      this.stars = data.stars.map(([hip, ra, dec, mag, bv]) => ({
        hip, ra, dec, mag, v: A.raDecToVec(ra, dec), rgb: bvColor(bv), name: names[hip] || null,
      }));
      this.constellations = data.constellations.map((c) => ({
        id: c.id, ko: c.ko, en: c.en, rank: c.rank, ra: c.ra, dec: c.dec, v: A.raDecToVec(c.ra, c.dec),
        lines: c.lines.map((seg) => seg.map(([ra, dec]) => A.raDecToVec(ra, dec))),
      }));
      this.conById = Object.fromEntries(this.constellations.map((c) => [c.id, c]));
      this.milkyWay = data.milkyWay.map(([ra, dec, lvl]) => ({ v: A.raDecToVec(ra, dec), lvl }));
    }

    makeSprites() {
      const s = document.createElement('canvas');
      s.width = s.height = 64;
      const g = s.getContext('2d');
      const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      for (let i = 0; i <= 8; i++) {
        const t = i / 8;
        grad.addColorStop(t, `rgba(185,198,245,${Math.exp(-t * t * 4.5).toFixed(3)})`);
      }
      g.fillStyle = grad;
      g.fillRect(0, 0, 64, 64);
      this.mwSprite = s;
    }

    setProfile(profile) {
      this.profile = profile;
      this.uploadHorizon();
    }

    activeProfile() {
      return this.opts.terrain ? this.profile : this.flatProfile;
    }

    uploadHorizon() {
      const { gl } = this.groundGL;
      const p = this.activeProfile();
      const n = p.far.length;
      const buf = new Float32Array(n * 4);
      for (let i = 0; i < n; i++) {
        buf[i * 4] = p.far[i];
        buf[i * 4 + 1] = p.mid[i];
        buf[i * 4 + 2] = p.near[i];
        buf[i * 4 + 3] = p.water[i];
      }
      if (!this.horizonTex) this.horizonTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, this.horizonTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, n, 1, 0, gl.RGBA, gl.FLOAT, buf);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      this.uploadBuildings();
    }

    // buildings: { top, dist } (Buildings.profile 결과) 또는 null
    setBuildings(buildings) {
      this.buildings = buildings;
      this.uploadBuildings();
    }

    uploadBuildings() {
      const { gl } = this.groundGL;
      const b = this.opts.buildings ? this.buildings : null;
      const n = b ? b.top.length : 1;
      const top = new Float32Array(n).fill(-90);
      const buf = new Float32Array(n * 4);
      if (b) {
        const prof = this.activeProfile();
        for (let i = 0; i < n; i++) {
          const az = ((i + 0.5) * 360) / n;
          let t = b.top[i];
          // 더 가까운 산·언덕에 가려지는 먼 건물은 숨긴다
          if (b.dist[i] > 0.3 && t < this.profileAt(prof.near, az)) t = -90;
          if (b.dist[i] > 1.5 && t < this.profileAt(prof.mid, az)) t = -90;
          top[i] = t;
          buf[i * 4] = t;
          buf[i * 4 + 1] = b.dist[i];
        }
      } else {
        buf[0] = -90;
      }
      this.buildTop = top;
      if (!this.buildTex) this.buildTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, this.buildTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, n, 1, 0, gl.RGBA, gl.FLOAT, buf);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    }

    profileAt(arr, az) {
      const n = arr.length;
      const x = (A.mod(az, 360) / 360) * n;
      const i = Math.floor(x);
      const t = x - i;
      return arr[i % n] * (1 - t) + arr[(i + 1) % n] * t;
    }

    horizonAlt(az) {
      const bt = this.buildTop;
      const b = bt[Math.floor((A.mod(az, 360) / 360) * bt.length) % bt.length];
      return Math.max(this.profileAt(this.activeProfile().far, az), b);
    }

    resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = this.container.clientWidth;
      const h = this.container.clientHeight;
      this.dpr = dpr;
      this.cssW = w;
      this.cssH = h;
      for (const c of this.layers) {
        c.width = Math.round(w * dpr);
        c.height = Math.round(h * dpr);
        c.style.width = w + 'px';
        c.style.height = h + 'px';
      }
    }

    // ---------- 카메라 ----------
    camera() {
      const { az, alt, fov } = this.view;
      const f = A.altAzToVec(alt, az);
      const r = [Math.cos(az * DEG), -Math.sin(az * DEG), 0];
      const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
      // 화면의 긴 변이 시야각(fov)을 덮는다
      const span = Math.max(this.cssW, this.cssH, 1);
      const scale = (span / 2) / (2 * Math.tan((fov * DEG) / 4)); // CSS px / 투영 단위
      return { f, r, u, scale, cx: this.cssW / 2, cy: this.cssH / 2 };
    }

    project(v, cam, zMin = -0.2) {
      const z = v[0] * cam.f[0] + v[1] * cam.f[1] + v[2] * cam.f[2];
      if (z < zMin) return null;
      const x = v[0] * cam.r[0] + v[1] * cam.r[1] + v[2] * cam.r[2];
      const y = v[0] * cam.u[0] + v[1] * cam.u[1] + v[2] * cam.u[2];
      const k = (2 / (1 + z)) * cam.scale;
      return [cam.cx + k * x, cam.cy - k * y];
    }

    unproject(sx, sy, cam) {
      const X = (sx - cam.cx) / cam.scale;
      const Y = (cam.cy - sy) / cam.scale;
      const r2 = X * X + Y * Y;
      const x = (4 * X) / (4 + r2), y = (4 * Y) / (4 + r2), z = (4 - r2) / (4 + r2);
      return [0, 1, 2].map((i) => x * cam.r[i] + y * cam.u[i] + z * cam.f[i]);
    }

    degPerPx(cam) {
      return 1 / (cam.scale * DEG); // 화면 중심 기준 (스테레오 투영 배율 2 → 1/2 상쇄)
    }

    // ---------- 천체 위치 ----------
    computeEphemeris() {
      const jd = A.julianDate(new Date(this.time));
      const lst = A.gmst(jd) + this.lon;
      const H = A.horizonMatrix(lst, this.lat);
      const M = A.mulMat(H, A.precessionMatrix(jd));
      const toHor = (m, v) => this.refractVec(A.mulVec(m, v));
      const sunEq = A.sunEquatorial(jd);
      const sun = toHor(H, A.raDecToVec(sunEq.ra, sunEq.dec));
      const moonEq = A.moonEquatorial(jd);
      let moonV = A.mulVec(H, A.raDecToVec(moonEq.ra, moonEq.dec));
      const mAltAz = A.vecToAltAz(moonV);
      moonV = this.refractVec(A.altAzToVec(mAltAz.alt - moonEq.parallax * Math.cos(mAltAz.alt * DEG), mAltAz.az));
      const elong = A.angularDistance(moonV, sun);
      const moonIllum = (1 - Math.cos(elong * DEG)) / 2;
      // 차오르는 달인지: 달 황경 − 태양 황경
      const moonEcl = A.mod(Math.atan2(
        Math.sin(moonEq.ra * DEG) * Math.cos(A.obliquity(jd) * DEG) + Math.tan(moonEq.dec * DEG) * Math.sin(A.obliquity(jd) * DEG),
        Math.cos(moonEq.ra * DEG)) / DEG, 360);
      const waxing = A.mod(moonEcl - sunEq.lon, 360) < 180;
      const planets = A.planetPositions(jd).map((p) => Object.assign(p, { h: toHor(M, A.raDecToVec(p.ra, p.dec)) }));
      this.eph = { jd, lst, H, M, sun, moon: moonV, moonEq, moonIllum, waxing, elong, planets };
      return this.eph;
    }

    refractVec(v) {
      const alt = Math.asin(clamp(v[2], -1, 1)) / DEG;
      if (alt < -2 || alt > 80) return v;
      const ra = A.refract(alt);
      const h = Math.hypot(v[0], v[1]) || 1e-9;
      const c = Math.cos(ra * DEG) / h;
      return [v[0] * c, v[1] * c, Math.sin(ra * DEG)];
    }

    limitingMag(sunAlt) {
      const base = 6.6 - this.opts.pollution * 3.4;
      if (!this.opts.atmosphere) return 6.6;
      let lim = base;
      if (sunAlt > -18) lim = Math.min(base, base - ((sunAlt + 18) / 14) * (base - 1.5));
      if (sunAlt > -4) lim = 1.5 - ((sunAlt + 4) / 4) * 5.5;
      lim -= this.opts.cloud * 4 + this.moonLight * 1.3;
      return Math.max(lim, -5);
    }

    // ---------- 그리기 ----------
    render() {
      const cam = this.camera();
      const eph = this.computeEphemeris();
      this.picks = [];
      const sunAlt = Math.asin(eph.sun[2]) / DEG;
      const moonUp = eph.moon[2] > 0 ? 1 : 0;
      const moonLight = moonUp * eph.moonIllum * Math.min(1, eph.moon[2] * 4);
      this.moonLight = this.opts.atmosphere ? moonLight : 0;
      this.drawGL(this.skyGL, cam, eph, moonLight);
      this.drawStars(cam, eph, sunAlt);
      this.drawGL(this.groundGL, cam, eph, moonLight);
      this.drawOverlay(cam, eph, sunAlt);
      return eph;
    }

    drawGL(layer, cam, eph, moonLight) {
      const { gl, uniforms: u } = layer;
      const dpr = this.dpr;
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform2f(u.uRes, gl.drawingBufferWidth, gl.drawingBufferHeight);
      gl.uniform1f(u.uScale, cam.scale * dpr);
      gl.uniform3fv(u.uR, cam.r);
      gl.uniform3fv(u.uU, cam.u);
      gl.uniform3fv(u.uF, cam.f);
      gl.uniform3fv(u.uSun, eph.sun);
      gl.uniform3fv(u.uMoon, eph.moon);
      gl.uniform1f(u.uMoonLight, moonLight);
      gl.uniform1f(u.uAtmos, this.opts.atmosphere ? 1 : 0);
      if (u.uPollution) gl.uniform1f(u.uPollution, this.opts.pollution);
      if (u.uCloud) gl.uniform1f(u.uCloud, this.opts.atmosphere ? this.opts.cloud : 0);
      if (u.uHorizon) {
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, this.horizonTex);
        gl.uniform1i(u.uHorizon, 0);
        gl.uniform1f(u.uDegPerPx, this.degPerPx(cam) / dpr);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, this.buildTex);
        gl.uniform1i(u.uBuild, 1);
        gl.uniform1f(u.uEye, this.eyeHeight);
      }
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    drawStars(cam, eph, sunAlt) {
      const ctx = this.ctx;
      const dpr = this.dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, this.cssW, this.cssH);
      const lim = this.limitingMag(sunAlt);
      const darkness = this.opts.atmosphere ? clamp((-sunAlt - 6) / 12, 0, 1) * (1 - this.opts.cloud) : 1;
      const zoom = Math.sqrt(clamp(90 / this.view.fov, 0.6, 4));
      const pxPerDeg = 1 / this.degPerPx(cam);
      const W = this.cssW, Hh = this.cssH;
      const onScreen = (p, m = 40) => p && p[0] > -m && p[0] < W + m && p[1] > -m && p[1] < Hh + m;
      const M = eph.M;

      // 은하수 (격자 점마다 부드러운 빛 덩어리를 겹쳐 그림)
      if (this.opts.milkyWay && darkness > 0.05) {
        const mwAlpha = darkness * (1 - this.opts.pollution * 0.9) * (1 - 0.75 * this.moonLight) * 0.045;
        if (mwAlpha > 0.003) {
          ctx.globalCompositeOperation = 'lighter';
          const base = 1.2 * pxPerDeg * 3.2;
          for (const p of this.milkyWay) {
            const v = A.mulVec(M, p.v);
            if (v[2] < -0.1) continue;
            const z = v[0] * cam.f[0] + v[1] * cam.f[1] + v[2] * cam.f[2];
            const size = (base * 2) / (1 + z);
            const s = this.project(v, cam);
            if (!onScreen(s, size)) continue;
            ctx.globalAlpha = mwAlpha * p.lvl * this.extinctionFactor(v[2]);
            ctx.drawImage(this.mwSprite, s[0] - size / 2, s[1] - size / 2, size, size);
          }
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';
        }
      }

      // 고도·방위 격자
      if (this.opts.grid) this.drawGrid(ctx, cam);

      // 별자리 선
      if (this.opts.lines) {
        ctx.strokeStyle = this.opts.atmosphere && sunAlt > -6 ? 'rgba(150,190,255,0.25)' : 'rgba(120,170,255,0.45)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (const c of this.constellations) {
          for (const seg of c.lines) {
            let prev = null;
            for (const ev of seg) {
              const v = this.refractVec(A.mulVec(M, ev));
              const s = this.project(v, cam, -0.1);
              if (prev && s && Math.hypot(s[0] - prev[0], s[1] - prev[1]) < W * 1.5) {
                ctx.moveTo(prev[0], prev[1]);
                ctx.lineTo(s[0], s[1]);
              }
              prev = s;
            }
          }
        }
        ctx.stroke();
      }

      // 별
      for (const st of this.stars) {
        const v = this.refractVec(A.mulVec(M, st.v));
        if (v[2] < -0.05) continue;
        const s = this.project(v, cam);
        if (!onScreen(s, 10)) continue;
        const alt = Math.asin(v[2]) / DEG;
        const m = st.mag + this.extinctionMag(v[2]);
        if (m > lim + 0.3) continue;
        const delta = lim - m;
        const r = clamp(0.45 + 0.55 * Math.pow(Math.max(delta, 0) + 0.3, 0.85), 0.45, 6) * zoom;
        const a = clamp(delta / 1.5 + 0.35, 0.15, 1);
        const [cr, cg, cb] = st.rgb;
        if (st.mag < 1.6 && delta > 1) {
          const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r * 4);
          g.addColorStop(0, `rgba(${cr},${cg},${cb},${0.35 * a})`);
          g.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
          ctx.fillStyle = g;
          ctx.fillRect(s[0] - r * 4, s[1] - r * 4, r * 8, r * 8);
        }
        ctx.fillStyle = `rgba(${cr},${cg},${cb},${a})`;
        ctx.beginPath();
        ctx.arc(s[0], s[1], r, 0, Math.PI * 2);
        ctx.fill();
        if (st.mag < 5 && alt > this.horizonAlt(Math.atan2(v[0], v[1]) / DEG) - 0.2) {
          this.picks.push({ type: 'star', x: s[0], y: s[1], obj: st, v, mag: st.mag });
        }
      }

      // 태양·달·행성
      if (this.opts.planets) {
        for (const p of eph.planets) {
          const s = this.project(p.h, cam);
          if (!onScreen(s) || p.h[2] < -0.05) continue;
          const m = p.mag + this.extinctionMag(p.h[2]);
          if (m > lim + 0.5) continue;
          const r = clamp(1.2 + 0.7 * (lim - m), 1.5, 7) * zoom;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(s[0], s[1], r, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
          this.picks.push({ type: 'planet', x: s[0], y: s[1], obj: p, v: p.h, mag: p.mag });
        }
      }
      this.drawSun(ctx, cam, eph, pxPerDeg);
      this.drawMoon(ctx, cam, eph, pxPerDeg);
    }

    extinctionMag(sinAlt) {
      if (!this.opts.atmosphere) return 0;
      const alt = Math.asin(clamp(sinAlt, -1, 1)) / DEG;
      const airmass = 1 / (Math.sin(Math.max(alt, -1) * DEG + 0) + 0.50572 * Math.pow(Math.max(alt, -1) + 6.07995, -1.6364));
      return 0.25 * (Math.min(airmass, 40) - 1);
    }

    extinctionFactor(sinAlt) {
      return Math.pow(10, -0.4 * this.extinctionMag(sinAlt));
    }

    drawSun(ctx, cam, eph, pxPerDeg) {
      if (eph.sun[2] < -0.02) return;
      const s = this.project(eph.sun, cam);
      if (!s) return;
      const r = Math.max(5, 0.27 * pxPerDeg);
      ctx.fillStyle = '#fff6dc';
      ctx.shadowColor = '#ffd27a';
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.arc(s[0], s[1], r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      this.picks.push({ type: 'sun', x: s[0], y: s[1], v: eph.sun, obj: { ko: '태양' } });
    }

    drawMoon(ctx, cam, eph, pxPerDeg) {
      const mv = eph.moon;
      if (mv[2] < -0.02) return;
      const s = this.project(mv, cam);
      if (!s) return;
      const r = Math.max(6, 0.26 * pxPerDeg * 1.2);
      // 화면에서 태양 쪽 방향
      const sun = eph.sun;
      const d = sun[0] * mv[0] + sun[1] * mv[1] + sun[2] * mv[2];
      const t = sun.map((x, i) => x - d * mv[i]);
      const tl = Math.hypot(...t) || 1;
      const p2 = this.project(mv.map((x, i) => x + (0.01 * t[i]) / tl), cam);
      const theta = p2 ? Math.atan2(p2[1] - s[1], p2[0] - s[0]) : 0;
      const k = eph.moonIllum;
      ctx.save();
      ctx.translate(s[0], s[1]);
      ctx.rotate(theta);
      ctx.fillStyle = 'rgba(28,32,44,0.95)';
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      const e = r * (1 - 2 * k);
      ctx.fillStyle = '#f4f1e6';
      ctx.shadowColor = 'rgba(240,240,220,0.8)';
      ctx.shadowBlur = 18 * k;
      ctx.beginPath();
      ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
      ctx.ellipse(0, 0, Math.abs(e), r, 0, Math.PI / 2, -Math.PI / 2, e > 0);
      ctx.fill();
      ctx.restore();
      this.picks.push({ type: 'moon', x: s[0], y: s[1], v: mv, obj: { ko: '달' } });
    }

    drawGrid(ctx, cam) {
      ctx.strokeStyle = 'rgba(255,200,120,0.18)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      const line = (pts) => {
        let prev = null;
        for (const v of pts) {
          const s = this.project(v, cam, -0.3);
          if (prev && s && Math.hypot(s[0] - prev[0], s[1] - prev[1]) < this.cssW) {
            ctx.moveTo(prev[0], prev[1]);
            ctx.lineTo(s[0], s[1]);
          }
          prev = s;
        }
      };
      for (let alt = 0; alt < 90; alt += 10) {
        const pts = [];
        for (let az = 0; az <= 360; az += 2) pts.push(A.altAzToVec(alt, az));
        line(pts);
      }
      for (let az = 0; az < 360; az += 15) {
        const pts = [];
        for (let alt = 0; alt <= 90; alt += 2) pts.push(A.altAzToVec(alt, az));
        line(pts);
      }
      ctx.stroke();
    }

    drawOverlay(cam, eph, sunAlt) {
      const ctx = this.octx;
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.clearRect(0, 0, this.cssW, this.cssH);
      const visible = (v) => {
        const alt = Math.asin(clamp(v[2], -1, 1)) / DEG;
        return alt > this.horizonAlt(Math.atan2(v[0], v[1]) / DEG);
      };
      ctx.textBaseline = 'middle';
      const day = this.opts.atmosphere && sunAlt > -6;

      // 겹치는 라벨은 건너뛴다 (먼저 놓인 것이 우선)
      const placed = [];
      const label = (text, x, y, align) => {
        const w = ctx.measureText(text).width;
        const x0 = align === 'center' ? x - w / 2 : x;
        const box = [x0 - 2, y - 8, x0 + w + 2, y + 8];
        if (placed.some((q) => box[0] < q[2] && box[2] > q[0] && box[1] < q[3] && box[3] > q[1])) return;
        placed.push(box);
        ctx.textAlign = align;
        ctx.fillText(text, x, y);
      };

      if (this.opts.planets) {
        ctx.font = '600 12px "Noto Sans KR", system-ui, sans-serif';
        for (const p of this.picks) {
          if (p.type === 'star' || !visible(p.v)) continue;
          ctx.fillStyle = p.type === 'planet' ? p.obj.color : '#fff3c4';
          label(p.obj.ko, p.x + 9, p.y + 10, 'left');
        }
      }

      if (this.opts.starNames) {
        ctx.font = '12px "Noto Sans KR", system-ui, sans-serif';
        ctx.fillStyle = 'rgba(255,240,200,0.8)';
        const magLimit = this.view.fov > 120 ? 1.5 : this.view.fov > 60 ? 2.3 : 3.5;
        for (const p of this.picks) {
          if (p.type !== 'star' || !p.obj.name || p.mag > magLimit) continue;
          label(p.obj.name.ko, p.x + 6, p.y - 7, 'left');
        }
      }

      if (this.opts.conNames) {
        const minRank = this.view.fov > 120 ? 1 : this.view.fov > 70 ? 2 : 3;
        ctx.font = '500 13px "Noto Sans KR", system-ui, sans-serif';
        ctx.fillStyle = day ? 'rgba(220,235,255,0.55)' : 'rgba(150,190,255,0.75)';
        for (const c of this.constellations) {
          if (c.rank > minRank) continue;
          const v = this.refractVec(A.mulVec(eph.M, c.v));
          if (!visible(v)) continue;
          const s = this.project(v, cam, 0);
          if (s) label(c.ko, s[0], s[1], 'center');
        }
      }

      // 방위 표시
      ctx.textAlign = 'center';
      for (const [name, az] of CARDINALS) {
        const v = A.altAzToVec(this.horizonAlt(az) - 2.2, az);
        const s = this.project(v, cam, 0);
        if (!s) continue;
        const main = az % 90 === 0;
        ctx.font = (main ? '700 16px' : '500 12px') + ' "Noto Sans KR", system-ui, sans-serif';
        ctx.fillStyle = az === 0 ? 'rgba(255,120,110,0.95)' : 'rgba(255,215,150,0.85)';
        ctx.fillText(name, s[0], s[1] + (main ? 6 : 4));
      }

      if (this.selected) {
        const sel = this.picks.find((p) => p.obj === this.selected.obj);
        if (sel) {
          ctx.strokeStyle = 'rgba(255,220,120,0.9)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(sel.x, sel.y, 11, 0, Math.PI * 2);
          ctx.stroke();
          this.selected = sel;
        }
      }
    }

    pick(x, y) {
      let best = null, bestD = 16;
      for (const p of this.picks) {
        const d = Math.hypot(p.x - x, p.y - y) - (p.type === 'star' ? 0 : 4);
        if (d < bestD) { bestD = d; best = p; }
      }
      this.selected = best;
      return best;
    }

    constellationAt(v) {
      // 별자리 이름표 위치와 가장 가까운 별자리 (대략적 판정)
      let best = null, bestD = 1e9;
      for (const c of this.constellations) {
        const d = A.angularDistance(A.mulVec(this.eph.M, c.v), v);
        if (d < bestD) { bestD = d; best = c; }
      }
      return best;
    }
  }

  root.SkyView = SkyView;
})(window);

</script>
  <script>
// 화면 구성과 상호작용: 위치·시간 입력, 지도, 드래그/확대, 천체 정보.
(function () {
  'use strict';

  const A = window.Astro;
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');

  const PRESETS = [
    ['서울 남산', 37.5512, 126.9882],
    ['제주 한라산', 33.3617, 126.5292],
    ['강원 영월 별마로천문대', 37.1985, 128.4875],
    ['설악산 대청봉', 38.1194, 128.4656],
    ['몽골 고비사막', 43.5, 104.0],
    ['하와이 마우나케아', 19.8207, -155.4681],
    ['칠레 아타카마 사막', -24.6272, -70.4042],
    ['미국 그랜드캐니언', 36.0544, -112.1401],
    ['스위스 체르마트', 46.0207, 7.7491],
    ['뉴질랜드 테카포', -44.0046, 170.4775],
    ['노르웨이 트롬쇠', 69.6492, 18.9553],
    ['적도 · 태평양 한가운데', 0.0, -150.0],
  ];

  const state = {
    offsetMin: 540,
    tzName: '',
    playing: false,
    dirty: true,
    lastFrame: 0,
    info: null,
    localInfo: null,
    loadToken: 0,
    baseProfile: null,
    buildingData: null,
  };

  let sky;
  try {
    sky = new window.SkyView($('sky'), window.SKY_DATA);
  } catch (e) {
    document.body.insertAdjacentHTML('beforeend', '<p style="padding:80px 20px;text-align:center">' + e.message + '</p>');
    return;
  }
  window.skyView = sky; // 콘솔 디버깅용
  const requestDraw = () => { state.dirty = true; };

  // ---------- 상태 표시 ----------
  let statusTimer = 0;
  function showStatus(text, ms) {
    const el = $('status');
    el.textContent = text;
    el.hidden = false;
    clearTimeout(statusTimer);
    if (ms) statusTimer = setTimeout(() => { el.hidden = true; }, ms);
  }

  // ---------- 시간 ----------
  function localParts(t) {
    const d = new Date(t + state.offsetMin * 60000);
    return { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes() };
  }

  function formatOffset(min) {
    const s = min < 0 ? '−' : '+';
    const a = Math.abs(min);
    return 'UTC' + s + Math.floor(a / 60) + (a % 60 ? ':' + pad(a % 60) : '');
  }

  function setTime(t, { keepInput = false } = {}) {
    sky.time = t;
    const p = localParts(t);
    if (!keepInput) $('datetime').value = `${p.y}-${pad(p.mo)}-${pad(p.d)}T${pad(p.h)}:${pad(p.mi)}`;
    $('timeSlider').value = p.h * 60 + p.mi;
    requestDraw();
    scheduleUrlUpdate();
  }

  function localToUtc(y, mo, d, h, mi) {
    return Date.UTC(y, mo - 1, d, h, mi) - state.offsetMin * 60000;
  }

  $('datetime').addEventListener('change', (e) => {
    const m = /^(\d+)-(\d+)-(\d+)T(\d+):(\d+)/.exec(e.target.value);
    if (m) setTime(localToUtc(+m[1], +m[2], +m[3], +m[4], +m[5]), { keepInput: true });
  });
  $('timeSlider').addEventListener('input', (e) => {
    const p = localParts(sky.time);
    const v = +e.target.value;
    setTime(localToUtc(p.y, p.mo, p.d, Math.floor(v / 60), v % 60));
  });
  $('nowBtn').addEventListener('click', () => setTime(Date.now()));
  $('tonightBtn').addEventListener('click', () => {
    const p = localParts(Date.now());
    setTime(localToUtc(p.y, p.mo, p.d, 21, 0));
  });
  $('playBtn').addEventListener('click', () => {
    state.playing = !state.playing;
    $('playBtn').textContent = state.playing ? '❚❚ 정지' : '▶ 재생';
    state.lastFrame = performance.now();
  });

  // ---------- 위치 ----------
  function setLocation(lat, lon, { name = null, fromMap = false } = {}) {
    lat = Math.max(-90, Math.min(90, lat));
    lon = ((((lon + 180) % 360) + 360) % 360) - 180;
    sky.lat = lat;
    sky.lon = lon;
    $('lat').value = lat.toFixed(4);
    $('lon').value = lon.toFixed(4);
    state.localInfo = null;
    state.offsetMin = Math.round(lon / 15) * 60;
    state.tzName = '경도 기준 추정';
    $('placeName').textContent = name || `${fmtCoord(lat, '북위', '남위')} ${fmtCoord(lon, '동경', '서경')}`;
    updateMeta();
    setTime(sky.time);
    updateMap(lat, lon, fromMap);
    state.baseProfile = null;
    state.buildingData = null;
    sky.setProfile(window.Terrain.syntheticProfile(lat, lon));
    sky.setBuildings(null);
    requestDraw();

    const token = ++state.loadToken;
    showStatus('지형 불러오는 중…');
    window.Terrain.loadHorizon(lat, lon, (f) => {
      if (token === state.loadToken) showStatus(`지형 불러오는 중… ${Math.round(f * 100)}%`);
    }).then((prof) => {
      if (token !== state.loadToken) return;
      state.baseProfile = prof;
      applyEyeHeight();
      state.elevation = prof.observerElevation;
      updateMeta();
      showStatus('실제 지형(수치표고모델)을 적용했습니다', 2500);
      requestDraw();
    }).catch(() => {
      if (token !== state.loadToken) return;
      state.elevation = null;
      showStatus('지형 자료를 받지 못해 가상 지형을 표시합니다 (오프라인?)', 4000);
    });

    state.buildingStatus = '건물 불러오는 중…';
    window.Buildings.load(lat, lon).then((data) => {
      if (token !== state.loadToken) return;
      state.buildingData = data;
      const n = data.list.length;
      state.buildingStatus = n ? `건물 ${n.toLocaleString()}개` : '주변에 등록된 건물 없음';
      if (!data.nearOk || !data.farOk) state.buildingStatus += ' (일부만 받음)';
      applyEyeHeight();
      updateMeta();
      showStatus(n ? `주변 건물 ${n.toLocaleString()}개를 반영했습니다 (OpenStreetMap)`
        : 'OpenStreetMap에 이 주변 건물이 등록되어 있지 않습니다', 4000);
    }).catch((e) => {
      if (token !== state.loadToken) return;
      console.warn('건물 자료 오류:', e);
      state.buildingStatus = '건물 자료 실패';
      updateMeta();
      showStatus('건물 서버(OpenStreetMap Overpass)가 응답하지 않습니다. 잠시 후 "이 위치의 하늘 보기"를 다시 눌러 주세요', 6000);
    });

    window.Terrain.loadLocalInfo(lat, lon).then((info) => {
      if (token !== state.loadToken) return;
      state.localInfo = info;
      state.offsetMin = info.utcOffsetMin;
      state.tzName = info.timezone;
      applyCloud();
      setTime(sky.time);
      updateMeta();
    }).catch(() => {});

    if (!name) {
      window.Terrain.reverseGeocode(lat, lon).then((n) => {
        if (token === state.loadToken && n) $('placeName').textContent = n;
      }).catch(() => {});
    }
    scheduleUrlUpdate();
  }

  // 관측 높이(옥상·전망대 등)를 지형·건물 윤곽에 반영
  function applyEyeHeight() {
    const extra = Math.max(0, parseFloat($('eyeHeight').value) || 0);
    sky.eyeHeight = window.Terrain.EYE_HEIGHT_M + extra;
    if (state.baseProfile) sky.setProfile(window.Terrain.reprofile(state.baseProfile, extra));
    sky.setBuildings(state.buildingData ? window.Buildings.profile(state.buildingData, sky.eyeHeight, state.baseProfile) : null);
    requestDraw();
    scheduleUrlUpdate();
  }

  function fmtCoord(v, pos, neg) {
    return `${v >= 0 ? pos : neg} ${Math.abs(v).toFixed(2)}°`;
  }

  function updateMeta() {
    const parts = [`${fmtCoord(sky.lat, 'N', 'S').replace(' ', '')} ${fmtCoord(sky.lon, 'E', 'W').replace(' ', '')}`];
    if (state.elevation != null) parts.push(`해발 ${Math.round(state.elevation)} m`);
    const li = state.localInfo;
    if (li && li.cloudCover != null) parts.push(`현재 구름 ${li.cloudCover}%`);
    if (li && li.temperature != null) parts.push(`${li.temperature}°C`);
    if (state.buildingStatus) parts.push(state.buildingStatus);
    $('placeMeta').textContent = parts.join(' · ');
    $('tzLabel').textContent = `(${state.tzName ? state.tzName + ', ' : ''}${formatOffset(state.offsetMin)})`;
  }

  function applyCloud() {
    const li = state.localInfo;
    sky.opts.cloud = $('useCloud').checked && li && li.cloudCover != null ? li.cloudCover / 100 : 0;
    requestDraw();
  }

  $('locForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const lat = parseFloat($('lat').value), lon = parseFloat($('lon').value);
    if (Number.isFinite(lat) && Number.isFinite(lon)) setLocation(lat, lon);
  });

  $('geoBtn').addEventListener('click', () => {
    if (!navigator.geolocation) return showStatus('이 브라우저는 위치 정보를 지원하지 않습니다', 3000);
    showStatus('현재 위치 확인 중…');
    navigator.geolocation.getCurrentPosition(
      (pos) => setLocation(pos.coords.latitude, pos.coords.longitude),
      () => showStatus('위치 권한이 없거나 위치를 찾지 못했습니다', 3000),
      { enableHighAccuracy: true, timeout: 10000 });
  });

  const presetSel = $('presets');
  PRESETS.forEach(([name, lat, lon], i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = name;
    presetSel.appendChild(o);
  });
  presetSel.addEventListener('change', () => {
    if (presetSel.value === '') return;
    const [name, lat, lon] = PRESETS[+presetSel.value];
    setLocation(lat, lon, { name });
    presetSel.value = '';
  });

  $('searchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = $('searchQ').value.trim();
    const ul = $('searchResults');
    if (!q) return;
    ul.innerHTML = '<li>검색 중…</li>';
    window.Terrain.searchPlace(q).then((list) => {
      ul.innerHTML = '';
      if (!list.length) ul.innerHTML = '<li>결과가 없습니다</li>';
      for (const r of list) {
        const li = document.createElement('li');
        li.textContent = r.name;
        li.addEventListener('click', () => {
          ul.innerHTML = '';
          setLocation(r.lat, r.lon, { name: r.name.split(',').slice(0, 2).join(',') });
        });
        ul.appendChild(li);
      }
    }).catch(() => { ul.innerHTML = '<li>검색 서비스에 연결할 수 없습니다</li>'; });
  });

  // ---------- 지도 ----------
  let map = null, marker = null, wedge = null;
  function initMap() {
    if (!window.L) {
      $('map').innerHTML = '<div class="map-offline">지도를 불러올 수 없습니다</div>';
      return;
    }
    map = L.map('map', { zoomControl: true, attributionControl: true }).setView([sky.lat, sky.lon], 11);
    const layers = {
      sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 18, attribution: 'Esri, Maxar, Earthstar Geographics',
      }),
      osm: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap',
      }),
    };
    let current = layers.sat.addTo(map);
    document.querySelectorAll('input[name="basemap"]').forEach((r) => r.addEventListener('change', () => {
      map.removeLayer(current);
      current = layers[r.value].addTo(map);
    }));
    marker = L.circleMarker([sky.lat, sky.lon], { radius: 6, color: '#ffd37a', weight: 2, fillOpacity: 0.9 }).addTo(map);
    wedge = L.polygon([], { color: '#7fb0ff', weight: 1, fillOpacity: 0.18, interactive: false }).addTo(map);
    map.on('click', (e) => setLocation(e.latlng.lat, e.latlng.lng, { fromMap: true }));
  }

  function updateMap(lat, lon, fromMap) {
    if (!map) return;
    marker.setLatLng([lat, lon]);
    if (!fromMap) map.setView([lat, lon], Math.max(map.getZoom(), 10));
    updateWedge();
  }

  function updateWedge() {
    if (!map) return;
    const { az, fov } = sky.view;
    const half = Math.min(fov, 359) / 2;
    const R = 8; // km
    const pts = [[sky.lat, sky.lon]];
    for (let a = az - half; a <= az + half + 0.01; a += Math.max(2, half / 10)) {
      const d = R / 6371, t = a * A.DEG, p1 = sky.lat * A.DEG;
      const p2 = Math.asin(Math.sin(p1) * Math.cos(d) + Math.cos(p1) * Math.sin(d) * Math.cos(t));
      const l2 = sky.lon * A.DEG + Math.atan2(Math.sin(t) * Math.sin(d) * Math.cos(p1), Math.cos(d) - Math.sin(p1) * Math.sin(p2));
      pts.push([p2 / A.DEG, l2 / A.DEG]);
    }
    wedge.setLatLngs(sky.view.alt > 80 ? [] : pts);
  }

  // ---------- 보기 옵션 ----------
  document.querySelectorAll('[data-opt]').forEach((el) => {
    el.checked = !!sky.opts[el.dataset.opt];
    el.addEventListener('change', () => {
      sky.opts[el.dataset.opt] = el.checked;
      if (el.dataset.opt === 'terrain') sky.uploadHorizon();
      if (el.dataset.opt === 'buildings') sky.uploadBuildings();
      requestDraw();
    });
  });
  $('useCloud').addEventListener('change', applyCloud);
  $('eyeHeight').addEventListener('change', applyEyeHeight);
  const pollutionNames = ['아주 어두운 하늘', '시골', '교외', '도시 근교', '도심'];
  const updatePollution = () => {
    sky.opts.pollution = +$('pollution').value;
    $('pollutionLabel').textContent = '(' + pollutionNames[Math.min(4, Math.floor(sky.opts.pollution * 5))] + ')';
    requestDraw();
  };
  $('pollution').addEventListener('input', updatePollution);
  updatePollution();

  document.querySelectorAll('[data-look]').forEach((b) => b.addEventListener('click', () => {
    sky.view = { az: +b.dataset.look, alt: 25, fov: 100 };
    onViewChange();
  }));
  $('zenithBtn').addEventListener('click', () => {
    const span = Math.max(sky.cssW, sky.cssH), minDim = Math.min(sky.cssW, sky.cssH);
    sky.view = { az: 180, alt: 90, fov: Math.min(230, 4 * Math.atan(span / minDim * 1.02) / A.DEG) };
    onViewChange();
  });

  $('togglePanel').addEventListener('click', () => $('panel').classList.toggle('closed'));
  if (window.innerWidth < 640) $('panel').classList.add('closed');

  // ---------- 둘러보기 (드래그, 확대) ----------
  const skyEl = $('sky');
  const pointers = new Map();
  let dragStart = null, pinchStart = null, moved = false;

  function onViewChange() {
    const v = sky.view;
    v.alt = Math.max(-30, Math.min(90, v.alt));
    v.az = A.mod(v.az, 360);
    v.fov = Math.max(8, Math.min(230, v.fov));
    updateWedge();
    requestDraw();
    scheduleUrlUpdate();
  }

  skyEl.addEventListener('pointerdown', (e) => {
    skyEl.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    moved = false;
    if (pointers.size === 1) {
      dragStart = { x: e.clientX, y: e.clientY, view: Object.assign({}, sky.view) };
      skyEl.classList.add('dragging');
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchStart = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), fov: sky.view.fov };
    }
  });
  skyEl.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    if (pointers.size === 2 && pinchStart) {
      const [a, b] = [...pointers.values()];
      sky.view.fov = pinchStart.fov * pinchStart.d / Math.max(10, Math.hypot(a[0] - b[0], a[1] - b[1]));
      moved = true;
      onViewChange();
    } else if (pointers.size === 1 && dragStart) {
      const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      const k = sky.view.fov / Math.max(sky.cssW, sky.cssH);
      const flip = dragStart.view.alt > 89 ? -1 : 1;
      sky.view.az = dragStart.view.az - dx * k * flip;
      sky.view.alt = dragStart.view.alt + dy * k;
      onViewChange();
    }
  });
  const endPointer = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = null;
    if (pointers.size === 0) {
      skyEl.classList.remove('dragging');
      if (!moved && dragStart) selectAt(e.clientX, e.clientY);
      dragStart = null;
    } else if (pointers.size === 1) {
      const [p] = [...pointers.values()];
      dragStart = { x: p[0], y: p[1], view: Object.assign({}, sky.view) };
    }
  };
  skyEl.addEventListener('pointerup', endPointer);
  skyEl.addEventListener('pointercancel', endPointer);
  skyEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    sky.view.fov *= Math.exp(e.deltaY * 0.0012);
    onViewChange();
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.target.matches('input, select, textarea')) return;
    const step = sky.view.fov / 20;
    const keys = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
    if (keys[e.key]) {
      sky.view.az += keys[e.key][0];
      sky.view.alt += keys[e.key][1];
    } else if (e.key === '+' || e.key === '=') sky.view.fov /= 1.15;
    else if (e.key === '-') sky.view.fov *= 1.15;
    else if (e.key === ' ') { $('playBtn').click(); e.preventDefault(); return; }
    else return;
    e.preventDefault();
    onViewChange();
  });

  window.addEventListener('resize', () => { sky.resize(); requestDraw(); });

  // ---------- 천체 정보 ----------
  function fmtRA(ra) {
    const h = ra / 15;
    return `${Math.floor(h)}h ${pad(Math.floor((h % 1) * 60))}m`;
  }
  function fmtDec(dec) {
    const a = Math.abs(dec);
    return `${dec < 0 ? '−' : '+'}${Math.floor(a)}° ${pad(Math.floor((a % 1) * 60))}′`;
  }
  function azName(az) {
    return ['북', '북북동', '북동', '동북동', '동', '동남동', '남동', '남남동', '남', '남남서', '남서', '서남서', '서', '서북서', '북서', '북북서'][Math.round(az / 22.5) % 16];
  }

  function selectAt(x, y) {
    const p = sky.pick(x, y);
    state.info = p;
    renderInfo();
    requestDraw();
  }

  function renderInfo() {
    const el = $('info');
    const p = state.info;
    if (!p) { el.hidden = true; return; }
    const { alt, az } = A.vecToAltAz(p.v);
    let title, sub = '', rows = [];
    if (p.type === 'star') {
      const st = p.obj;
      const con = st.name && st.name.c ? sky.conById[st.name.c] : sky.constellationAt(p.v);
      title = st.name ? st.name.ko : `HIP ${st.hip}`;
      sub = [st.name && st.name.en, con && `${st.name && st.name.b ? st.name.b + ' ' : ''}${con.ko}`].filter(Boolean).join(' · ');
      rows = [['밝기', `${st.mag.toFixed(2)} 등급`], ['적경/적위', `${fmtRA(st.ra)} / ${fmtDec(st.dec)}`]];
    } else if (p.type === 'planet') {
      title = p.obj.ko;
      sub = '행성';
      rows = [['밝기', `약 ${p.obj.mag.toFixed(1)} 등급`], ['지구로부터', `${p.obj.dist.toFixed(2)} AU`]];
    } else if (p.type === 'moon') {
      title = '달';
      sub = moonPhaseName(sky.eph);
      rows = [['밝은 면', `${Math.round(sky.eph.moonIllum * 100)}%`]];
    } else {
      title = '태양';
      sub = '맨눈이나 망원경으로 직접 보지 마세요';
    }
    rows.push(['고도', `${alt.toFixed(1)}°`], ['방위', `${az.toFixed(1)}° (${azName(az)})`]);
    el.innerHTML = `<h3></h3><div class="meta"></div><dl></dl>`;
    el.querySelector('h3').textContent = title;
    el.querySelector('.meta').textContent = sub;
    el.querySelector('dl').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
    el.hidden = false;
  }

  function moonPhaseName(eph) {
    const k = eph.moonIllum;
    if (k < 0.03) return '삭 (달이 거의 보이지 않음)';
    if (k > 0.97) return '보름달';
    if (Math.abs(k - 0.5) < 0.06) return eph.waxing ? '상현달' : '하현달';
    if (k < 0.5) return eph.waxing ? '초승달' : '그믐달';
    return eph.waxing ? '차오르는 달' : '기우는 달';
  }

  function sunState(alt) {
    if (alt > 0) return '낮';
    if (alt > -6) return '시민 박명';
    if (alt > -12) return '항해 박명';
    if (alt > -18) return '천문 박명';
    return '밤';
  }

  function updateClock(eph) {
    const p = localParts(sky.time);
    const sunAlt = Math.asin(eph.sun[2]) / A.DEG;
    $('clock').innerHTML = `<b>${p.y}.${pad(p.mo)}.${pad(p.d)} ${pad(p.h)}:${pad(p.mi)}</b>` +
      `<span class="meta">${sunState(sunAlt)} · 태양 ${sunAlt.toFixed(0)}° · ${moonPhaseName(eph)}</span>`;
  }

  // ---------- URL 공유 ----------
  let urlTimer = 0;
  function scheduleUrlUpdate() {
    clearTimeout(urlTimer);
    urlTimer = setTimeout(() => {
      const q = new URLSearchParams({
        lat: sky.lat.toFixed(4), lon: sky.lon.toFixed(4), t: new Date(sky.time).toISOString().slice(0, 16) + 'Z',
        h: (+$('eyeHeight').value || 0).toFixed(0), az: sky.view.az.toFixed(0), alt: sky.view.alt.toFixed(0), fov: sky.view.fov.toFixed(0),
      });
      try { history.replaceState(null, '', '?' + q); } catch (e) { /* file:// 등 */ }
    }, 400);
  }

  // ---------- 그리기 루프 ----------
  function frame(now) {
    if (state.playing) {
      const dt = Math.min(0.1, (now - state.lastFrame) / 1000);
      setTime(sky.time + dt * +$('speed').value * 1000);
    }
    state.lastFrame = now;
    if (state.dirty) {
      state.dirty = false;
      const eph = sky.render();
      updateClock(eph);
      if (state.info) {
        state.info = sky.selected;
        renderInfo();
      }
    }
    requestAnimationFrame(frame);
  }

  // ---------- 시작 ----------
  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) && Number.isFinite(parseFloat(q.get(k))) ? parseFloat(q.get(k)) : d);
  const t0 = q.has('t') ? Date.parse(q.get('t')) : NaN;
  sky.time = Number.isFinite(t0) ? t0 : Date.now();
  sky.view = { az: num('az', 180), alt: num('alt', 25), fov: num('fov', 100) };
  $('eyeHeight').value = Math.max(0, num('h', 0));
  sky.eyeHeight = window.Terrain.EYE_HEIGHT_M + +$('eyeHeight').value;
  initMap();
  setLocation(num('lat', PRESETS[0][1]), num('lon', PRESETS[0][2]), { name: q.has('lat') ? null : PRESETS[0][0] });
  onViewChange();
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
